    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <div id="cadastro">

            <input type="text" id="nomeProdutoTxt">

            <input type="text" id="quantidadeTxt">

            <input type="text" id="precoTxt">
            <input type="button" value="ADICIONAR PRODUTO" onclick="add()">

        <div id="estoque">
            <table id="tabela">
            </table>
        </div>
        <div id="resumo">

        </div>
        <div id="busca">
            <p>Busca</p>
            <input type="text" id="busca">
            <input type="button" value="Buscar">
        </div>
    </section>

</html>
