<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top-bar">
        <h1><i class="fa-solid fa-box-open"></i>SISTEMA DE ESTOQUE - <span>BERNARDO GAUSSMANN</span></h1>
    </header>
    <section>
        <div id="cadastro">
            <h2><i class="fa-solid fa-user-check"></i> CADASTRAR PRODUTO</h2>
            <p>Nome do produto</p>
            <input type="text" id="nomeProdutoTxt">
            <p>Quantidade</p>
            <input type="text" id="quantidadeTxt">
            <p>Preço unitário</p>
            <input type="text" id="precoTxt">
            <input type="button" value="ADICIONAR PRODUTO" id="botaoAdicionar">
        </div>
        <div id="estatisticas">
            <h2><i class="fa-solid fa-chart-pie"></i> ESTATÍSTICAS</h2>
            <p>Total de Itens: <span id="totalItens">0</span></p>
            <p>Valor Total: <span id="valorTotal">R$ 0.00</span></p>
        </div>
        <div id="estoque">
            <h2><i class="fa-solid fa-boxes-stacked"></i> PRODUTOS EM ESTOQUE</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo"></tbody>
            </table>
        </div>
        <div id="busca">
            <h2><i class="fa-solid fa-magnifying-glass"></i> REMOVER ITEM</h2>
            <div class="search-box">
                <input type="text" id="inputBusca" placeholder="Apagar por ID">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input type="button" value="APAGAR" id="botaoApagar">
        </div>
    </section>
</body>
<script type="module" src="js/main.js"></script>

</html>
